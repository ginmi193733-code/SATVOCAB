<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SAT Vocab" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>SAT Vocab Flashcards</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f5f5f2, #141414);
      --panel: light-dark(#ffffff, #202020);
      --text: light-dark(#181818, #f4f4f4);
      --muted: light-dark(#6b6b6b, #a8a8a8);
      --border: light-dark(#deded8, #383838);
      --button: light-dark(#ecece8, #2b2b2b);
      --good: light-dark(#dff3e4, #23482d);
      --bad: light-dark(#f7dddd, #522a2a);
      --primary: light-dark(#111111, #f2f2f2);
      --primaryText: light-dark(#ffffff, #111111);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; }
    body { min-height: 100vh; }
    button, select { font: inherit; }
    .app { max-width: 920px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom)); outline:none; }
    .topbar { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
    .title { font-size: 22px; font-weight: 800; }
    .muted { color: var(--muted); font-size: 14px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
    select, button {
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--button);
      color: var(--text);
      padding: 10px 14px;
    }
    button { font-weight: 700; cursor: pointer; }
    button.primary { background: var(--primary); color: var(--primaryText); border-color: transparent; }
    button.good { background: var(--good); }
    button.bad { background: var(--bad); }
    .card {
      min-height: 390px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 34px;
      user-select:none;
      cursor:pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .word { font-size: clamp(42px, 8vw, 76px); line-height: 1.05; font-weight: 800; letter-spacing: -.03em; overflow-wrap:anywhere; }
    .def { font-size: clamp(20px, 3.4vw, 30px); line-height: 1.5; max-width: 760px; }
    .cn { margin-top: 20px; font-size: clamp(20px, 3vw, 28px); font-weight: 750; line-height:1.45; }
    .hint { margin-top: 18px; color: var(--muted); font-size: 14px; }
    .controls { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
    .keys { text-align:center; margin-top:12px; color:var(--muted); font-size:13px; }
    kbd { border:1px solid var(--border); border-bottom-width:2px; border-radius:7px; padding:2px 7px; background:var(--panel); color:var(--text); font-weight:800; }
    .stats { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:12px; color:var(--muted); font-size:14px; }
    .progress { width:100%; height:8px; background:var(--button); border-radius:999px; overflow:hidden; margin:12px 0 2px; }
    .progress > div { height:100%; background:var(--text); width:0%; transition:width .2s ease; }
    .smallbtn { min-height:40px; padding:8px 12px; font-size:14px; }.checkpoint-overlay{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.52);backdrop-filter:blur(8px)}.checkpoint-overlay.show{display:flex}.checkpoint-box{width:min(560px,100%);padding:24px;border:1px solid var(--border);border-radius:24px;background:var(--panel);text-align:center}.checkpoint-title{font-size:26px;font-weight:850;margin-bottom:8px}.checkpoint-sub{color:var(--muted);margin-bottom:18px}.checkpoint-actions{display:grid;gap:10px}.checkpoint-actions button{width:100%;min-height:54px}
    @media (max-width: 640px) {
      .app { padding-left:12px; padding-right:12px; }
      .card { min-height:340px; padding:24px 18px; }
      .controls { grid-template-columns:1fr 1fr; }
      .toolbar { align-items:stretch; }
      .toolbar > * { flex:1 1 auto; }
    }
  </style>
</head>
<body>
<main class="app" id="app" tabindex="0">
  <div class="topbar">
    <div>
      <div class="title">SAT Vocab</div>
      <div class="muted">991 words · full Chinese glosses · progress saves automatically</div>
    </div>
    <div class="muted" id="summary">会 0 · 不会 0</div>
  </div>

      <option value="all">全部 991</option>
      <option value="1">Part 1 · 1–200</option>
      <option value="2">Part 2 · 201–400</option>
      <option value="3">Part 3 · 401–600</option>
      <option value="4">Part 4 · 601–800</option>
      <option value="5">Part 5 · 801–991</option>
      <option value="wrong">只刷不会</option>
    </select>
    <button id="shuffle" class="smallbtn">随机打乱</button>
    <button id="auto" class="smallbtn">▶ Auto Play</button>
    <select id="speed" aria-label="Autoplay speed">
      <option value="slow">慢速</option>
      <option value="normal" selected>正常</option>
      <option value="fast">快速</option>
    </select>
    <button id="voice" class="smallbtn">🔊 语音开</button>
    <button id="reset" class="smallbtn">重置当前进度</button>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <section class="card" id="card" aria-live="polite">
    <div id="front">
      <div class="word" id="word"></div>
      <div class="hint">Press I to reveal meaning</div>
    </div>
    <div id="back" hidden>
      <div class="def" id="definition"></div>
      <div class="cn" id="chinese"></div>
      <div class="hint">Press I to show the word again</div>
    </div>
  </section>

  <div class="controls">
    <button id="prev">U · 上一张</button>
    <button id="flip" class="primary">I · 翻卡</button>
    <button id="wrong" class="bad">O · 不会</button>
    <button id="known" class="good">P · 会</button>
  </div>

  <div class="keys" id="autoStatus">Auto Play 已暂停</div>

  <div class="stats">
    <span id="counter">1 / 991</span>
    <span id="seen">已看 0 张</span>
  </div>

    $("#word").textContent = "🎉";
    $("#definition").textContent = "";
    $("#chinese").textContent = "";
    $("#front").hidden = false;
    $("#back").hidden = true;
    $("#counter").textContent = "0 / 0";
    $("#bar").style.width = "0%";
    $("#seen").textContent = "这个列表目前没有词";
    updateSummary();
    return;
  }
  const idx = state.order[state.pos];
  const c = CARDS[idx];
  $("#word").textContent = c.word;
  $("#definition").textContent = c.definition;
  $("#chinese").textContent = "中文：" + c.cn;
  $("#front").hidden = state.flipped;
  $("#back").hidden = !state.flipped;
  $("#counter").textContent = `${state.pos + 1} / ${state.order.length}`;
  $("#bar").style.width = `${((state.pos + 1) / state.order.length) * 100}%`;
  const seenCount = state.order.reduce((n, i) => n + (state.seen[i] ? 1 : 0), 0);
  $("#seen").textContent = `当前列表已看 ${seenCount} 张`;
  updateSummary();
}

function updateSummary() {
  const known = Object.values(state.known).filter(Boolean).length;
  const wrong = Object.values(state.wrong).filter(Boolean).length;
  $("#summary").textContent = `会 ${known} · 不会 ${wrong}`;
}

function flip() {
  if (!state.order.length) return;
  state.flipped = !state.flipped;
  state.seen[state.order[state.pos]] = true;
  save();
  render();
}

function next() {
  if (!state.order.length) return;
  state.pos = (state.pos + 1) % state.order.length;
  state.flipped = false;
  render();
}

function prev() {
  if (!state.order.length) return;
  state.pos = (state.pos - 1 + state.order.length) % state.order.length;
  state.flipped = false;
  render();
}

function markKnown() {
  if (!state.order.length) return;
  const idx = state.order[state.pos];
  state.known[idx] = true;
  delete state.wrong[idx];
  state.seen[idx] = true;
  save();
  if (state.part === "wrong") rebuildOrder();
  else next();
}

function markWrong() {
  if (!state.order.length) return;
  const idx = state.order[state.pos];
  state.wrong[idx] = true;
  delete state.known[idx];
  state.seen[idx] = true;
  save();
  next();
}

function shuffle() {
  for (let i = state.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  }
  state.pos = 0;
  state.flipped = false;
  render();
}


function stopSpeech() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
}

function getVoice(langPrefix) {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix.toLowerCase())) || null;
}

function speak(text, lang, rate = 1) {
  return new Promise(resolve => {
    if (!voiceEnabled || !("speechSynthesis" in window) || !text) {
      resolve();
      return;
    }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang;
    const v = getVoice(lang.split("-")[0]);
    if (v) utter.voice = v;
    utter.rate = rate;
    utter.pitch = 1;
    utter.onend = resolve;
    utter.onerror = resolve;
    window.speechSynthesis.speak(utter);
  });
}

function wait(ms, token) {
  return new Promise(resolve => {
    autoTimer = setTimeout(() => {
      if (token === autoToken) resolve();
    }, ms);
  });
}

function timing() {
  const mode = $("#speed").value;
  if (mode === "slow") return {front: 2500, back: 3500, rate: 0.82};
  if (mode === "fast") return {front: 900, back: 1600, rate: 1.12};
  return {front: 1600, back: 2500, rate: 0.96};
}

function setAutoStatus(text) {
  $("#autoStatus").textContent = text;
}

function showCheckpoint(){pauseAuto();checkpointOpen=true;checkpointGroupStart=Math.floor(state.pos/20)*20;const s=checkpointGroupStart+1,e=Math.min(checkpointGroupStart+20,state.order.length);$("#checkpointText").textContent=`第 ${s}–${e} 个词完成。接下来去哪？`;$("#cpNext").disabled=e>=state.order.length;$("#checkpoint").classList.add("show");}
function closeCheckpoint(){checkpointOpen=false;$("#checkpoint").classList.remove("show");}
function checkpointNext(){if(!checkpointOpen)return;const n=checkpointGroupStart+20;if(n>=state.order.length)return;state.pos=n;state.flipped=false;closeCheckpoint();render();startAuto();}
function checkpointRepeat(){if(!checkpointOpen)return;state.pos=checkpointGroupStart;state.flipped=false;closeCheckpoint();render();startAuto();}
function checkpointStart(){if(!checkpointOpen)return;state.pos=0;state.flipped=false;closeCheckpoint();render();startAuto();}
async function autoCycle(token) {
  while (autoPlaying && token === autoToken && state.order.length) {
    const idx = state.order[state.pos];
    const c = CARDS[idx];
    const t = timing();

    state.flipped = false;
    state.seen[idx] = true;
    save();
    render();

    setAutoStatus(`▶ 单词：${c.word}`);
    stopSpeech();
    await speak(c.word, "en-US", t.rate);
    if (!autoPlaying || token !== autoToken) break;
    await wait(t.front, token);
    if (!autoPlaying || token !== autoToken) break;

    state.flipped = true;
    render();

    setAutoStatus("▶ 英文释义");
    const cleanDef = c.definition.replace(/\([^)]*\)/g, "").replace(/\d+\./g, "").trim();
    await speak(cleanDef, "en-US", t.rate);
    if (!autoPlaying || token !== autoToken) break;

    setAutoStatus("▶ 中文翻译");
    await speak(c.cn, "zh-CN", Math.max(0.78, t.rate - 0.08));
    if (!autoPlaying || token !== autoToken) break;
    await wait(t.back, token);
    if (!autoPlaying || token !== autoToken) break;

    next();
  }
}

function startAuto() {
  if (autoPlaying || !state.order.length) return;
  autoPlaying = true;
  autoToken++;
  $("#auto").textContent = "⏸ Pause";
  setAutoStatus("▶ Auto Play 运行中");
  autoCycle(autoToken);
}

function pauseAuto() {
  autoPlaying = false;
  autoToken++;
  if (autoTimer) clearTimeout(autoTimer);
  autoTimer = null;
  stopSpeech();
  $("#auto").textContent = "▶ Auto Play";
  setAutoStatus("Auto Play 已暂停");
}

function toggleAuto() {
  if (autoPlaying) pauseAuto();
  else startAuto();
}

$("#cpNext").addEventListener("click",checkpointNext);\n$("#cpRepeat").addEventListener("click",checkpointRepeat);\n$("#cpStart").addEventListener("click",checkpointStart);\n$("#part").value = state.part;
$("#part").addEventListener("change", e => {
  pauseAuto();
  state.part = e.target.value;
  save();
  rebuildOrder();
});
$("#card").addEventListener("click", () => { pauseAuto(); flip(); });
$("#flip").addEventListener("click", () => { pauseAuto(); flip(); });
$("#prev").addEventListener("click", () => { pauseAuto(); prev(); });
$("#known").addEventListener("click", () => { pauseAuto(); markKnown(); });
$("#wrong").addEventListener("click", () => { pauseAuto(); markWrong(); });
$("#shuffle").addEventListener("click", () => { pauseAuto(); shuffle(); });
$("#auto").addEventListener("click", toggleAuto);
$("#voice").addEventListener("click", () => {
  voiceEnabled = !voiceEnabled;
  if (!voiceEnabled) stopSpeech();
  $("#voice").textContent = voiceEnabled ? "🔊 语音开" : "🔇 语音关";
});
$("#speed").addEventListener("change", () => {
  if (autoPlaying) {
    pauseAuto();
    startAuto();
  }
});
$("#reset").addEventListener("click", () => {
  pauseAuto();
  if (!confirm("重置“会 / 不会 / 已看”记录？")) return;
  state.known = {};
  state.wrong = {};
  state.seen = {};
  save();
  rebuildOrder();
});

app.addEventListener("keydown", e => {
  const target = e.target;
  if (target && ["INPUT","TEXTAREA","SELECT"].includes(target.tagName)) return;
  const k = e.key.toLowerCase();
  if (e.code === "Space") { e.preventDefault(); toggleAuto(); }
  else if (k === "u") { e.preventDefault(); pauseAuto(); prev(); }
  else if (k === "i") { e.preventDefault(); pauseAuto(); flip(); }
  else if (k === "o") { e.preventDefault(); pauseAuto(); markWrong(); }
  else if (k === "p") { e.preventDefault(); pauseAuto(); markKnown(); }
});

rebuildOrder();
setTimeout(() => app.focus(), 50);
</script>
</body>
</html>
